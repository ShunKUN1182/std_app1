<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product - APP1</title>
        <!-- Tailwind CSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script type="module" src="../js/product.js" defer></script>
    </head>
    <body class="bg-slate-50">
        <header class="h-20 px-8 bg-amber-400 flex items-center">
            <h1 class="text-2xl font-bold text-red-50">作品一覧</h1>
        </header>
        <div class="container m-auto">
            <div class="flex gap-2 my-8">
                <div class="shadow-xl rounded-md">
                    <img
                        src="../img/img-default.png"
                        alt="作品サムネイル"
                        class="bg-gray-300 w-80 h-60 my-0 rounded-t-md"
                    />
                    <div class="flex flex-col gap-1 p-6">
                        <h2 class="text-lg">作品タイトル</h2>
                        <p class="text-sm">説明文</p>
                        <ul class="flex gap-2">
                            <li class="text-xs bg-gray-950 text-white p-2 rounded-md mt-1">HTML</li>
                            <li class="text-xs bg-gray-950 text-white p-2 rounded-md mt-1">CSS</li>
                            <li class="text-xs bg-gray-950 text-white p-2 rounded-md mt-1">JS</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
